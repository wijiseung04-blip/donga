title: "[RFC] "
body:
  - type: markdown
    attributes:
      value: |
        설계 변경을 제안하고 의견을 모으는 양식입니다.
        토론 기간이 끝나면 작성자가 결론을 댓글로 정리하고, 채택되면 `docs/adr/`에 ADR로 기록합니다.
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 무엇을 바꾸자는 제안인지 한두 문장으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 배경과 동기
      description: 지금 어떤 문제가 있고, 왜 바꿔야 하는지 적습니다.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 구체적으로 무엇을 어떻게 바꿀지 적습니다.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 다른 방법과 선택하지 않은 이유를 적습니다.
  - type: textarea
    id: impact
    attributes:
      label: 영향과 위험
      description: 영향받는 코드·워크플로·사람, 되돌리는 방법을 적습니다.
  - type: textarea
    id: questions
    attributes:
      label: 열린 질문
      description: 토론에서 의견을 받고 싶은 점을 적습니다.
  - type: input
    id: deadline
    attributes:
      label: 토론 마감일
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
