version: 2

updates:
  # npm 패키지 (packages/donga-utils)
  - package-ecosystem: "npm"
    directory: "/packages/donga-utils"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Python 의존성 (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions 버전 (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # Docker 베이스 이미지 (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Python 메이저 버전 변경(예: 3.x → 4.x)은 자동 제안하지 않는다
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
