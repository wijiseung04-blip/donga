name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # PR에서는 빌드(테스트 단계 포함)만 하고 레지스트리에는 올리지 않는다
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Verify pushed image
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run container and check health
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          docker run -d --name donga -p 8080:8080 -e APP_VERSION="${GITHUB_SHA::7}" "$IMAGE"

          # Dockerfile의 HEALTHCHECK가 healthy가 될 때까지 최대 60초 기다린다
          for _ in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' donga)
            [ "$health" = "healthy" ] && break
            sleep 2
          done
          echo "컨테이너 상태: $health"

          healthz=$(curl -fsS http://localhost:8080/healthz)
          root=$(curl -fsS http://localhost:8080/)
          echo "GET /healthz → $healthz"
          echo "GET /        → $root"
          docker logs donga
          docker rm -f donga > /dev/null

          if [ "$health" != "healthy" ] || ! echo "$root" | grep -q '"Hello, world!"'; then
            echo "::error::컨테이너 헬스체크 또는 응답 확인에 실패했습니다."
            exit 1
          fi
          {
            echo "## 이미지 실행 검증 완료"
            echo "- 이미지: \`$IMAGE\`"
            echo "- 헬스 상태: \`$health\`"
            echo "- GET /healthz: \`$healthz\`"
            echo "- GET /: \`$root\`"
          } >> "$GITHUB_STEP_SUMMARY"
