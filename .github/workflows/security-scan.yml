name: Security Scan

on:
  schedule:
    - cron: "23 0 * * 1" # 매주 월요일 09:23 KST
  pull_request:
    branches: [main]
    paths:
      - "packages/donga-utils/package.json"
      - "requirements.txt"
      - ".github/workflows/security-scan.yml"
  workflow_dispatch:
    inputs:
      always-report:
        description: 취약점이 없어도 리포트 이슈를 남길지 여부
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: npm audit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit
        working-directory: packages/donga-utils
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm audit --json > "$GITHUB_WORKSPACE/npm-audit.json" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -f json -o pip-audit.json || true

      - name: Build report
        id: report
        run: |
          python - <<'EOF'
          import json, os

          npm = json.load(open("npm-audit.json"))
          sev = npm.get("metadata", {}).get("vulnerabilities", {})
          npm_total = sev.get("total", 0)

          pip = json.load(open("pip-audit.json"))
          # 같은 패키지·취약점이 중복 보고되는 경우가 있어 순서를 유지하며 제거
          pip_vulns = list(dict.fromkeys(
              (d["name"], d["version"], v["id"], ", ".join(v.get("fix_versions", [])) or "-")
              for d in pip.get("dependencies", []) for v in d.get("vulns", [])))

          lines = [
              "## 보안 스캔 리포트",
              "",
              "| 도구 | 대상 | 취약점 |",
              "|---|---|---|",
              f"| npm audit | packages/donga-utils | {npm_total}건 |",
              f"| pip-audit | requirements.txt | {len(pip_vulns)}건 |",
              "",
              "### npm audit 심각도별",
              "| critical | high | moderate | low | info |",
              "|---|---|---|---|---|",
              "| {critical} | {high} | {moderate} | {low} | {info} |".format(
                  **{k: sev.get(k, 0) for k in ["critical", "high", "moderate", "low", "info"]}),
          ]
          if npm_total:
              lines += ["", "### npm 취약 패키지", "| 패키지 | 심각도 | 수정 가능 |", "|---|---|---|"]
              for name, v in npm.get("vulnerabilities", {}).items():
                  lines.append(f"| {name} | {v.get('severity')} | {'예' if v.get('fixAvailable') else '아니오'} |")
          if pip_vulns:
              lines += ["", "### Python 취약 패키지", "| 패키지 | 버전 | 취약점 ID | 수정 버전 |", "|---|---|---|---|"]
              lines += [f"| {n} | {ver} | {i} | {fix} |" for n, ver, i, fix in pip_vulns]

          report = "\n".join(lines) + "\n"
          open("security-report.md", "w").write(report)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(report)

          high = sev.get("critical", 0) + sev.get("high", 0)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"total={npm_total + len(pip_vulns)}\n")
              out.write(f"high={high}\n")
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: |
            security-report.md
            npm-audit.json
            pip-audit.json
          retention-days: 30

      - name: Create or update report issue
        if: >-
          github.event_name != 'pull_request' &&
          (steps.report.outputs.total != '0' || inputs.always-report)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const label = 'security';
            const title = '🔒 보안 스캔 리포트';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync('security-report.md', 'utf8') + `\n실행 기록: ${runUrl}\n`;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: '보안 스캔 결과' });
            }

            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              core.notice(`기존 리포트 이슈 #${existing.number}에 결과를 추가했습니다.`);
            } else {
              const { data: issue } = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              core.notice(`리포트 이슈 #${issue.number}를 만들었습니다.`);
            }

      - name: Fail on high or critical (PR only)
        if: github.event_name == 'pull_request' && steps.report.outputs.high != '0'
        run: |
          echo "::error::high/critical 취약점이 있어 PR을 통과시키지 않습니다."
          exit 1
