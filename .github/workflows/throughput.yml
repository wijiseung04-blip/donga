name: Weekly Throughput

on:
    workflow_dispatch:
    schedule:
      - cron: "0 0 * * 0"


jobs:
    calculate-throughput:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        issues: read
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get Closed Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          shell: bash
        run: |
          SINCE=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          CLOSED_ISSUES=$(gh issue list \
          --repo "$GH_REPO" \
          --state closed \
          --limit 1000 \
          --json closedAt \
          --jq "[.[] | select(.closedAt != null and .closedAt >= \"$SINCE\")] | length")
          echo "Weekly throughput: ${CLOSED_ISSUES} closed issues"
    
