name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR에서는 새 커밋이 오면 이전 실행을 취소하고, main/develop 배포는 중간에 끊지 않는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'scripts/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'pytest.ini'
              - '.github/workflows/ci.yml'
              - '.github/workflows/reusable-*.yml'
              - '.github/actions/**'

  lint:
    name: Lint
    needs: changes
    # 코드가 바뀌었거나 수동 실행일 때만 실행 (문서만 바뀐 PR은 건너뜀)
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          extra-packages: flake8
      - name: Lint with flake8
        run: |
          # 문법 오류·정의되지 않은 이름이 있으면 실패
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # 나머지 스타일 문제는 경고로만 표시
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: Compile sources
        run: python -m compileall -q src scripts
      - name: Package app
        run: |
          mkdir -p dist
          tar --exclude='__pycache__' -czf dist/donga-app.tar.gz src requirements.txt
          sha256sum dist/donga-app.tar.gz > dist/SHA256SUMS
          cat > dist/build-info.json <<EOF
          {"commit": "${GITHUB_SHA}", "ref": "${GITHUB_REF_NAME}", "run": "${GITHUB_RUN_NUMBER}"}
          EOF
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: donga-app
          path: dist/
          retention-days: 7

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/reusable-test.yml
    with:
      os-list: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      python-versions: '["3.10", "3.12", "3.13"]'
      artifact-name: donga-app

  deploy-production:
    name: Production
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: production
    secrets:
      deploy-token: ${{ secrets.DEPLOY_TOKEN }}

  deploy-staging:
    name: Staging
    needs: [build, test]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: staging
    secrets:
      deploy-token: ${{ secrets.DEPLOY_TOKEN }}

  deploy-preview:
    name: Preview
    needs: [build, test]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: preview
    secrets:
      deploy-token: ${{ secrets.DEPLOY_TOKEN }}