name: Project Automation

on:
  issues:
    types: [opened, closed]

jobs:
  add-to-project:
    # StudyMate 작업 이슈([issueN])만 보드에 추가한다. PR·테스트·자동 생성 이슈는 제외.
    if: startsWith(github.event.issue.title, '[issue')
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v0.4.0
        with:
          project-url: https://github.com/users/wijiseung04-blip/projects/3/views/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
