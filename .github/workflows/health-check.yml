
name: Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment URL
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL is not configured."
            echo "Deploy the application before enabling health checks."
            exit 0
          fi

          echo "HEALTH_URL is configured."
          echo "Run an actual health check after deployment."
