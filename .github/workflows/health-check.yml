name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Service
        run: |
          # 서비스 접속 시도, 실패 시 오류 출력
          if curl -f https://myapp.com/health; then
            echo "Service is down!"
          else
            echo "Service is down!"
          fi
