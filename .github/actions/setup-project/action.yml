name: Setup Project
description: Python 설치, pip 캐시, 의존성 설치를 한 번에 수행합니다.

inputs:
  python-version:
    description: 설치할 Python 버전
    required: false
    default: "3.12"
  cache:
    description: pip 캐시 사용 여부 ("true" 또는 "false")
    required: false
    default: "true"
  extra-packages:
    description: requirements.txt 외에 추가로 설치할 패키지 (공백으로 구분)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache == 'true' && 'pip' || '' }}

    - name: Install dependencies
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt $EXTRA_PACKAGES
